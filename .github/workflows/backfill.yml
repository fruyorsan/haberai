name: Arsiv Yenileme

on:
  schedule:
    - cron: "0 * * * *" # saatte bir; govdesi veya editorNote eksik haberleri yeniler
  workflow_dispatch: {} # elle calistirma

# Ana hat ile AYNI kilit grubu: ayni anda asla calismazlar (git + AI kotasi cakismasi onlenir)
concurrency:
  group: arsiv-yenileme
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Hattin bagimliliklarini kur
        run: npm ci

      - name: Eski haberleri yeni bicimle yenile
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BACKFILL_LIMIT: "4"
        run: npm run backfill

      - name: Degisiklikleri kaydet
        id: commit
        run: |
          git config user.name "haber-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Yenilenecek haber yok."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: arsiv yenileme ($(date -u +%Y-%m-%dT%H:%MZ))"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git fetch origin main
          git merge --no-edit -X ours origin/main
          git push

      - name: Site bagimliliklarini kur
        if: steps.commit.outputs.changed == 'true'
        run: cd site && npm ci

      # Ozel alan adi yalnizca CUSTOM_DOMAIN degiskeni tanimliysa yazilir
      # (bkz. pipeline.yml aciklamasi).
      - name: Ozel alan adi (hazirsa CNAME yaz)
        if: steps.commit.outputs.changed == 'true' && vars.CUSTOM_DOMAIN != ''
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: printf '%s\n' "$CUSTOM_DOMAIN" > site/public/CNAME

      - name: Siteyi derle
        if: steps.commit.outputs.changed == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT_MAKALE: ${{ vars.ADSENSE_SLOT_MAKALE }}
          ADSENSE_SLOT_MAKALE2: ${{ vars.ADSENSE_SLOT_MAKALE2 }}
          ADSENSE_SLOT_LISTE: ${{ vars.ADSENSE_SLOT_LISTE }}
        run: cd site && npm run build

      - name: GitHub Pages'e yayinla
        if: steps.commit.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: fruyorsan/fruyorsan.github.io
          publish_branch: main
          publish_dir: ./site/dist
          force_orphan: true
          user_name: haber-bot
          user_email: bot@users.noreply.github.com
          commit_message: "arsiv yenileme: ${{ github.run_number }}"
