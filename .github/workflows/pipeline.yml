name: Haber Hatti

on:
  schedule:
    - cron: "*/5 * * * *" # her 5 dakikada bir (GitHub bazen birkac dk geciktirebilir)
  workflow_dispatch: {} # elle calistirma

# Ayni anda iki calistirma olmasin (git cakismasini onler)
concurrency:
  group: haber-hatti
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Hattin bagimliliklarini kur
        run: npm ci

      - name: Haberleri topla ve AI ile isle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run collect

      - name: Degisiklikleri kaydet
        id: commit
        run: |
          git config user.name "haber-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Yeni haber yok."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: yeni haberler ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Site bagimliliklarini kur
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: cd site && npm ci

      - name: Siteyi derle
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: cd site && npm run build

      - name: Netlify'a yayinla
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --prod --dir=site/dist
