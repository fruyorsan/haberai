name: Haber Hattı

on:
  schedule:
    - cron: "*/5 * * * *" # her 5 dakikada bir (GitHub bazen birkaç dk geciktirebilir)
  workflow_dispatch: {} # elle çalıştırma

# Aynı anda iki çalıştırma olmasın (git çakışmasını önler)
concurrency:
  group: haber-hatti
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Haberleri topla ve AI ile işle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run collect

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "haber-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/articles.json
          if git diff --staged --quiet; then
            echo "Yeni haber yok."
          else
            git commit -m "chore: yeni haberler ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase
            git push
          fi
