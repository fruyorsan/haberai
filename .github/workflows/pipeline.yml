name: Haber Hatti

on:
  schedule:
    - cron: "*/5 * * * *" # her 5 dakikada bir (GitHub bazen birkac dk geciktirebilir)
  workflow_dispatch: {} # elle calistirma
  # main'e yapilan her push (site/kod degisikligi) aninda derlenip yayina alinsin
  push:
    branches: [main]

# Ayni anda iki calistirma olmasin (git cakismasini onler)
concurrency:
  group: haber-hatti
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Hattin bagimliliklarini kur
        run: npm ci

      - name: Haberleri topla ve AI ile isle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run collect

      # Yeni haberleri sosyal kanallara paylasir. Anahtar yoksa hata vermez,
      # sessizce atlar. data/social.json sonraki adimda commit'e girer.
      - name: Sosyal paylasim
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SHARE_WEBHOOK_URL: ${{ secrets.SHARE_WEBHOOK_URL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run share

      - name: Degisiklikleri kaydet
        id: commit
        run: |
          git config user.name "haber-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Yeni veri yok."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: veri guncellemesi ($(date -u +%Y-%m-%dT%H:%MZ))"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Uzak ilerlemisse cakismasiz birlestir; taze verimiz kazanir
          git fetch origin main
          git merge --no-edit -X ours origin/main
          git push

      - name: Site bagimliliklarini kur
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: cd site && npm ci

      - name: Siteyi derle
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: cd site && npm run build

      - name: Netlify'a yayinla
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --prod --dir=site/dist
