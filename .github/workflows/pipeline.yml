name: Haber Hattı

on:
  schedule:
    - cron: "*/30 * * * *" # her 30 dakikada bir
  workflow_dispatch: {} # elle çalıştırma

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Haberleri topla ve AI ile işle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: npm run collect

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "haber-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/articles.json
          if git diff --staged --quiet; then
            echo "Yeni haber yok."
          else
            git commit -m "chore: yeni haberler ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
