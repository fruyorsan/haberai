# ---------------------------------------------------------------------------
# Netlify yapilandirmasi — 18.10.2026 itibariyla Netlify YAYIN ADRESI DEGIL.
#
# Tek yayin adresi: https://haberinai.site (GitHub Pages).
#
# Bu dosya yalnizca bir "sigorta": Netlify'a bir daha dagitim yapilirsa
# (kredi yenilenirse ya da elle deploy edilirse) site kopya olarak YAYINLANMAZ,
# tum istekleri haberinai.site'e kalici olarak yonlendirir ve arama motorlarina
# "noindex" der. Boylece Google'da ikinci bir kopya olusmaz.
#
# Gecmis: haberai.netlify.app uzun sure eski bir derlemeyi servis ediyordu
# (baslik "HaberAI", canonical https://fruyorsan.github.io) — arama
# sonuclarinda karisikliga yol aciyordu.
# ---------------------------------------------------------------------------

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 1) /api/* Netlify Fonksiyonu olarak kalsin (fonksiyonlar yonlendirilmez).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# 2) GERI KALAN HER SEY asil adrese kalici yonlendirilir.
[[redirects]]
  from = "/*"
  to = "https://haberinai.site/:splat"
  status = 301
  force = true

# 3) Yonlendirme sirasinda bile arama motorlari bu alan adini indekslemesin.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
