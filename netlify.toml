[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Hashed ve statik Astro dosyaları için 1 yıllık değişmez (immutable) önbellek
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Kapak ve grafik görselleri için 1 günlük + 7 gün arka plan yenileme
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Arama indeksi: 10 dakika önbellek + 1 saat arka plan yenileme
[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=3600"

# Son dakika akışı
[[headers]]
  for = "/breaking.json"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=120"

# Genel güvenlik başlıkları
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
